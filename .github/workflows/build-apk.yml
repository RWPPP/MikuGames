name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Extract project archive
        run: mkdir -p TriVryad && unzip -q TriVryad-android-project.zip -d TriVryad

      - name: Build APK
        run: gradle --no-daemon -p TriVryad assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TriVryad-debug-apk
          path: TriVryad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
