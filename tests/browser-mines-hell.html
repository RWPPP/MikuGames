<!doctype html><meta charset="utf-8"><pre id="report">RUNNING</pre><iframe id="game" src="../web/mines.html" style="width:360px;height:1800px"></iframe><script>
const key='miku-mines-hard-wins-v1',checks=[];let phase=0;function check(v,msg){if(!v)throw Error(msg);checks.push(msg);}
game.onload=()=>{try{const d=game.contentDocument,w=game.contentWindow,option=d.querySelector('#hell-option'),level=value=>{d.querySelector('#difficulty').value=value;d.querySelector('#difficulty').dispatchEvent(new w.Event('change'));},count=()=>Number(w.localStorage.getItem(key)||0);
if(phase===1){check(!option.hidden&&!option.disabled,'unlock persists after reload');level('hell');check(d.querySelectorAll('.mine-cell').length===576,'hell has 576 cells');check(d.querySelector('#remaining').textContent==='200','hell has 200 Teto');check(d.documentElement.scrollWidth<=w.innerWidth,'hell scroll stays in panel');document.querySelector('#report').textContent='PASS: '+checks.join('; ');return;}
w.localStorage.removeItem(key);check(option.hidden&&option.disabled,'hell initially locked');level('hell');check(d.querySelector('#difficulty').value==='hard','locked selection blocked');
const native=w.MinesGame.prototype.place;function winLayout(){w.MinesGame.prototype.place=function(first){native.call(this,first);this.cells.forEach((c,i)=>c.mine=i>=this.cells.length-this.mines);this.cells.forEach((c,i)=>c.count=this.neighbors(i).filter(n=>this.cells[n].mine).length);};}function win(){d.querySelector('#restart').click();d.querySelector('.mine-cell').click();check(d.querySelector('#result-text').textContent.includes('Победа'),'round won');}
winLayout();level('easy');win();check(count()===0,'easy victory not counted');level('normal');win();check(count()===0,'normal victory not counted');level('hard');win();check(count()===1&&option.hidden,'first hard win stays locked');d.querySelector('#close-result').click();d.querySelector('.mine-cell').click();check(count()===1,'victory only counted once');
w.MinesGame.prototype.place=function(first){native.call(this,first);this.cells[first].mine=true;};d.querySelector('#restart').click();d.querySelector('.mine-cell').click();check(d.querySelector('#result-text').textContent.includes('Попалась')&&count()===1,'loss keeps progress');winLayout();win();check(count()===2&&option.hidden,'second hard win stays locked');win();check(count()===3&&!option.hidden&&!option.disabled,'third hard win unlocks hell');check(d.querySelector('#result-detail').textContent.includes('Открыт уровень'),'unlock announced');phase=1;game.contentWindow.location.reload();
}catch(e){document.querySelector('#report').textContent='FAIL: '+e.message;}};
</script>
