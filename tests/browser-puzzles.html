<!doctype html><meta charset="utf-8"><pre id="report">RUNNING</pre><iframe id="s" src="../web/sudoku.html" style="width:360px;height:1600px"></iframe><iframe id="t" src="../web/tictactoe.html" style="width:1200px;height:1000px"></iframe><script>
const reports=[];function check(value,message){if(!value)throw Error(message);reports.push(message);}function finish(){if(reports.includes('sudoku complete')&&reports.includes('ttt complete'))document.querySelector('#report').textContent='PASS: '+reports.join('; ');}
function error(e){document.querySelector('#report').textContent='FAIL: '+e.message;}
s.onload=()=>{try{const w=s.contentWindow,d=w.document,cells=[...d.querySelectorAll('.sudoku-cell')],key=n=>d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:String(n),bubbles:true}));
check(d.documentElement.scrollWidth<=w.innerWidth,'mobile has no horizontal overflow');check(cells.length===81,'81 Sudoku cells');let state=JSON.parse(w.localStorage.getItem('miku-sudoku-v1'));let i=state.values.indexOf(0);cells[i].click();key(state.solution[i]===9?8:9);check(d.querySelector('#mistakes').textContent==='1','wrong answer tracked');d.querySelector('#erase').click();d.querySelector('#pencil').click();key(1);check(cells[i].querySelector('.notes'),'pencil notes');d.querySelector('#pencil').click();d.querySelector('#hint').click();check(JSON.parse(w.localStorage.getItem('miku-sudoku-v1')).hints===1,'hint saved');d.querySelector('#pause').click();check(d.querySelector('#sudoku-board').classList.contains('paused'),'pause hides grid');d.querySelector('#pause').click();state=JSON.parse(w.localStorage.getItem('miku-sudoku-v1'));for(let j=0;j<81;j++)if(!state.fixed[j]){cells[j].click();key(state.solution[j]);}check(d.querySelector('#result').open,'Sudoku win modal');reports.push('sudoku complete');finish();}catch(e){error(e);}};
t.onload=()=>{try{const d=t.contentDocument;d.querySelector('#mode').value='two';d.querySelector('#mode').dispatchEvent(new t.contentWindow.Event('change'));const cells=[...d.querySelectorAll('.ttt-cell')];for(const i of [0,3,1,4,2])cells[i].click();check(d.querySelector('#result').open,'TTT win modal');check(d.querySelector('#score-x').textContent==='1','TTT score');check(d.querySelectorAll('.win').length===3,'winning line highlighted');d.querySelector('#again').click();check(cells.every(c=>!c.textContent),'TTT round reset');reports.push('ttt complete');finish();}catch(e){error(e);}};
</script>
